name: Refresh Forbes Top 100 CSV

on:
  schedule:
    - cron: "45 6,16 * * *"   # daily 06:45 and 16:45 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Forbes top-100 CSV
        run: |
          python scripts/build_forbes_top100.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forbes_top100.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Forbes top-100 CSV (auto)"
          git pull --rebase origin main
          git push
